services:
  - type: web
    name: datanova
    runtime: python
    plan: free
    region: singapore
    buildCommand: pip install -r requirements.txt
    startCommand: python server.py
    healthCheckPath: /api/health
    envVars:
      - key: PYTHON_VERSION
        value: "3.12.10"
      - key: HOST
        value: 0.0.0.0
      - key: ADMIN_PASSWORD
        generateValue: true
